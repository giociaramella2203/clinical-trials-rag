[project]
name = "clinical-trials-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Giovanni Ciaramella", email = "giociaramella3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "openai>=3.11.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
clinical-trials-rag = "clinical_trials_rag:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
